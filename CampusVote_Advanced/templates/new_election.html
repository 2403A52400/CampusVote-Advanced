{% extends 'base.html' %}{% block title %}Create Election{% endblock %}{% block content %}<div class="page-heading"><div><span class="eyebrow">ADMIN · ELECTION SETUP</span><h1>Create an election</h1><p>Set the election title and voting period. You can add candidates next.</p></div></div><section class="panel form-panel"><form method="post" class="form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Election title<input name="title" required maxlength="120" placeholder="e.g. Student Council Election 2026"></label><label>Description<textarea name="description" rows="3" placeholder="Briefly describe this election"></textarea></label><div class="form-grid"><label>Start date and time<input type="datetime-local" name="start_at" required></label><label>End date and time<input type="datetime-local" name="end_at" required></label></div><div class="form-actions"><a class="btn ghost" href="{{ url_for('admin_dashboard') }}">Cancel</a><button class="btn primary">Create election →</button></div></form></section>{% endblock %}
